<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-box">
        <h1>Color Picker</h1>
    <div class="first">
        <label for="color">Choice your color :</label>
        <input type="color" id="color" class="box"> 
        <p class="box">
            hex code : <span id="code">#123456 </span>
        </p>
    </div> 
    <div class="second">
        <label for="color">Change text size</label>
        <input type="range" id="text" class="box" min="20" max="70" value="20"> 
    </div>
    <div class="third">
      
        <textarea  id="message" rows="6" class="box" placeholder="write any text"></textarea>
    </div>
    <div class="fourth">
        <button class="box" id="btn" onclick="clickme()">change</button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

</body>
</html>
